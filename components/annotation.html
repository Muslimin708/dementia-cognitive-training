<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
        }

        #photo-container {
            position: relative;
            display: inline-block;
            cursor: crosshair;
        }

        #event-photo {
            display: block;
            max-width: 100%;
            height: auto;
        }

        .face-marker {
            position: absolute;
            width: 70px;
            height: 70px;
            border: 3px solid red;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
    </style>
</head>

<body>

<div id="photo-container">
    __IMAGE__
</div>
